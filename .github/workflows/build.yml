name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "MedTracker-${{ github.run_number }}.apk"

      - name: Save it on the run page
        uses: actions/upload-artifact@v4
        with:
          name: MedTracker-${{ github.run_number }}
          path: MedTracker-${{ github.run_number }}.apk

      - name: Publish as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "MedTracker-${{ github.run_number }}.apk" \
            --title "MedTracker build ${{ github.run_number }}" \
            --notes "Install the APK on your Android phone. Built from ${{ github.sha }}."
